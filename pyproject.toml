[project]
name = "nautilus-rkm"
version = "0.2.6.dev0"
description = "Policy-first data broker for AI agents — one call plans, routes, enforces, attests, and audits every data access. Built on Fathom."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
# TODO: add author email once the maintainer publishes one.
authors = [{ name = "KrakenNet" }]
keywords = ["ai-agents", "data-broker", "policy-engine", "data-governance", "access-control", "rbac", "fathom", "clips", "security", "audit", "attestation", "compliance", "nist", "hipaa", "mcp", "llm", "rules-engine", "broker", "policy", "routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Framework :: FastAPI",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The broker, its transports and the adapters that need no driver (rest,
# servicenow, llm, static). Database and object-store drivers are extras: six
# of them accounted for roughly 60 MB of a 133 MB install, and a deployment
# brokering one REST source imported none of them.
dependencies = [
    "fathom-rules>=0.11.0",
    "pyyaml>=6.0",
    "pyjwt>=2.12.1",
    "cryptography>=46.0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # Capped below 2: mcp 2.x moved ``mcp.server.fastmcp`` to
    # ``mcp.server.mcpserver`` and renamed FastMCP to MCPServer, whose
    # __init__ takes neither ``stateless_http`` nor ``json_response`` and no
    # **kwargs, and whose Context is generic over two parameters, not three.
    # That is a port of nautilus/transport/mcp_server.py, not an import alias;
    # until it is done an uncapped range ships an MCP transport that dies on
    # import for anyone installing today.
    "mcp>=1.12,<2",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://krakennet.github.io/nautilus"
Repository = "https://github.com/KrakenNet/nautilus"
Documentation = "https://krakennet.github.io/nautilus"
Changelog = "https://github.com/KrakenNet/nautilus/blob/main/CHANGELOG.md"
Issues = "https://github.com/KrakenNet/nautilus/issues"

[project.scripts]
nautilus = "nautilus.cli:main"

[project.optional-dependencies]
# One extra per adapter that needs a driver. ``nautilus serve`` names the extra
# in its error when a configured source's driver is missing.
postgres = ["asyncpg>=0.30.0"]
pgvector = ["asyncpg>=0.30.0", "pgvector>=0.3.0"]
elasticsearch = ["elasticsearch>=8,<10"]
neo4j = ["neo4j>=5"]
influxdb = ["influxdb-client>=1.40"]
s3 = ["aiobotocore>=2.12"]
all = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "elasticsearch>=8,<10",
    "neo4j>=5",
    "influxdb-client>=1.40",
    "aiobotocore>=2.12",
]
dev = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "elasticsearch>=8,<10",
    "neo4j>=5",
    "influxdb-client>=1.40",
    "aiobotocore>=2.12",
    "nautilus-adapter-sdk",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "pip-licenses>=5.0",
    "respx>=0.21",
    "pytest-recording>=0.13",
    "testcontainers[elasticsearch,neo4j]>=4.0",
    "locust>=2.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "copier>=9.0",
]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-api>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-exporter-prometheus>=0.50b0",
    "prometheus-client>=0.20",
]
llm-anthropic = ["anthropic>=0.40"]
llm-openai = ["openai>=1.50"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mike>=2.1",
]

[project.entry-points."fathom.packs"]
data-routing-nist = "nautilus.rule_packs.data_routing_nist"
data-routing-hipaa = "nautilus.rule_packs.data_routing_hipaa"

[project.entry-points."nautilus.adapters"]
influxdb = "nautilus.adapters.influxdb:InfluxDBAdapter"
s3 = "nautilus.adapters.s3:S3Adapter"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.uv.workspace]
members = ["packages/nautilus-adapter-sdk"]

[tool.uv.sources]
nautilus-adapter-sdk = { workspace = true }

[tool.setuptools.packages.find]
include = ["nautilus*"]
exclude = ["tests*", "specs*", "docs*"]

[tool.setuptools.package-data]
"nautilus.analysis.llm.prompts" = ["*.txt"]
"nautilus.rules" = ["**/*.yaml"]
"nautilus.rule_packs" = ["**/*.yaml", "**/*.md"]
"nautilus.ui" = ["templates/**/*", "static/*"]
"nautilus" = ["templates/adapter/**/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC"]

[tool.pyright]
strict = ["nautilus", "tests"]
include = ["nautilus", "tests"]
extraPaths = ["packages/nautilus-adapter-sdk/src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The shipped example's compliance suite runs with the repo suite: it is a
# documented onboarding path ("cd examples/custom-adapter && pytest"), and
# while it sat outside testpaths every one of its cases errored unnoticed.
testpaths = ["tests", "examples/custom-adapter"]
markers = [
    "defect: pins a confirmed 1.0 defect; expected to fail until its fix lands",
    "journey: end-to-end test against a real backend",
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests (e.g. latency harness with 1000 requests)",
    "docker: tests that require a local Docker daemon",
]
addopts = "--strict-markers --cov=nautilus --cov-branch"
