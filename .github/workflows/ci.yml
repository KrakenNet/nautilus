name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13", "3.14"]
        # macOS leg catches cross-platform regressions in the unit suite
        # (``pytest -m "not docker"`` needs no Docker, so it runs everywhere).
        # Selection is opt-OUT: an unmarked test runs. Opt-in selection (-m unit)
        # silently skipped 399 of 1299 tests, whole regression suites included.
        include:
          - os: macos-latest
            python-version: "3.13"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Depth stays 1; tags do not come with it, and the version-rot check
          # in tests/defects/test_wave_ops12_build_identity.py compares the
          # packaged version against every released tag. Without this it fails
          # on every run for a reason that is not the version.
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # ``--all-extras`` so pyright sees the optional LLM providers
      # (anthropic, openai) and OTel/docs deps. Without them, pyright
      # ``strict = ["nautilus"]`` fails with reportMissingImports on
      # ``nautilus/analysis/llm/{anthropic,local}_provider.py`` even
      # though those modules guard their imports at runtime.
      - name: Install deps
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -m "not docker" --tb=short --cov-report=xml -q

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
