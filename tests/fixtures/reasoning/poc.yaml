# POC milestone fixture (reasoning-engine spec Task 1.15).
#
# Single pgvector source classified `cui` with data_types=[pii]. The agent
# registry declares `a1: clearance=cui`, which satisfies the
# default-classification-deny rule, and `a2: clearance=unclassified`, which
# trips it (POC assertion 6). Clearance comes from the registry, so the two
# cases need two agents -- a request cannot name its own clearance.
#
# `attestation.sink.type: file` exercises the store-and-forward path end-to-
# end; the destination path is env-interpolated so the integration test can
# redirect it under `tmp_path` (Windows has no /tmp) without template churn.
# `session_store.backend: postgres` exercises PostgresSessionStore — the DSN
# resolves from `TEST_PG_DSN` (exported by the pg_container fixture).
#
# The audit path is env-interpolated for the same reason as the attestation
# path: relative paths in a config resolve against the *config file's* own
# directory, so a plain `./audit.jsonl` here would append to this fixture
# directory inside the repo on every test run, no matter the CWD.
sources:
  - id: cui_embeddings
    type: pgvector
    description: "CUI embedding store holding PII for POC scenario"
    classification: cui
    data_types: [pii]
    connection: ${TEST_PGV_DSN}
    table: vuln_embeddings
    embedding_column: embedding
    metadata_column: metadata
    distance_operator: "<=>"
    top_k: 5

agents:
  a1:
    id: a1
    clearance: cui
  a2:
    id: a2
    clearance: unclassified

rules:
  user_rules_dirs: []

analysis:
  keyword_map:
    pii: [pii, email, phone, personal]
    threat: [threat, hunt, ioc]

audit:
  path: ${POC_AUDIT_PATH}

attestation:
  enabled: true
  sink:
    type: file
    path: ${POC_ATTESTATION_PATH}

session_store:
  backend: postgres
  on_failure: fail_closed
