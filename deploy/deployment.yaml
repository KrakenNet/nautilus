apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautilus
  labels:
    app.kubernetes.io/name: nautilus
spec:
  # More than one replica needs shared state: the postgres session store above,
  # a shared session_tokens.key_ring_path, and one writer for a chained
  # attestation sink. See docs/how-to/operator-guide.md#running-more-than-one-replica.
  replicas: 1
  # A rolling update must not overlap the old pod with the new one. The default
  # RollingUpdate strategy rounds maxSurge=25% up to 1, so at replicas: 1 it
  # starts the new pod before stopping the old one -- two brokers minting
  # session tokens from two different key rings, and, once `audit` is a
  # ReadWriteOnce PersistentVolumeClaim, a new pod that cannot mount the volume
  # at all until the old one releases it. That rollout does not finish.
  # Recreate costs the seconds between terminate and ready.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nautilus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nautilus
    spec:
      # The broker never calls the Kubernetes API. Leaving the token mounted
      # hands anything that reads /var/run/secrets a cluster credential the
      # process has no use for.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        # With the container securityContext below, this is the last field the
        # `restricted` Pod Security Standard requires: without it the pod is
        # rejected outright in a namespace labelled
        # pod-security.kubernetes.io/enforce=restricted.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nautilus
          # Built from the repository Dockerfile. The default image carries no
          # database drivers, and the ConfigMap beside this file configures a
          # `postgres` source and a `postgres` session store -- so build it
          # with the extras those sources need or the pod CrashLoopBackOffs on
          # "whose driver is not installed":
          #   docker build --build-arg EXTRAS="--extra postgres" \
          #     -t nautilus:0.2.2-postgres .
          # The image is distroless: it has no shell and no pip, so an extra
          # cannot be added to a built image. Pin a tag; `latest` with
          # imagePullPolicy: IfNotPresent silently keeps the old layer.
          image: nautilus:0.2.2-postgres
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/config/nautilus.yaml", "--bind", "0.0.0.0:8000", "--log-format", "json"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: nautilus-secrets
          # Traces are exported only when an endpoint is set. Left unset the
          # broker still creates spans and still serves every nautilus_* series
          # on /metrics; it just has nowhere to send traces, and says nothing
          # about it. Point this at a collector to turn export on.
          # env:
          #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #     value: http://otel-collector.observability:4318
          # /healthz is static: the process is up. /readyz also probes the
          # session store and the audit sink, so a broker that cannot write its
          # audit log leaves the rotation instead of serving unrecorded requests.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            # 5s + 3 x 30s: the broker has ~95s to open its Postgres pool and
            # create its tables before the kubelet calls the process dead.
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            # /readyz spends up to _READY_PROBE_TIMEOUT_S (2.0s, transport/
            # fastapi_app.py) on the sentinel read and up to another 2.0s on
            # the schema re-check. The kubelet's default timeoutSeconds is 1,
            # so a store that was merely slow read as a failed probe and the
            # pod left rotation before the handler had answered.
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # One uvicorn worker, and the per-request work is dominated by
            # synchronous CPU on that one event loop -- measured throughput does
            # not rise with concurrency, so a pod cannot use more than a core
            # and is throttled by anything less -- hence a whole core requested
            # and no cpu limit at all: a limit only adds throttling to a
            # workload that already cannot exceed one core.
            requests:
              cpu: "1"
              memory: 512Mi
              # The audit log is append-only and grows with traffic. Without a
              # request the scheduler places this pod with no regard for the
              # disk it will use; without a limit the node hits disk pressure
              # first, and disk pressure is a node condition -- the eviction
              # manager takes down the neighbours too. Keep the two emptyDir
              # sizeLimits below at or under this limit.
              ephemeral-storage: 2Gi
            limits:
              memory: 1Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: attestation-key
              mountPath: /etc/nautilus/keys
              readOnly: true
            - name: state
              mountPath: /var/lib/nautilus
            - name: audit
              mountPath: /var/log/nautilus
      volumes:
        - name: config
          configMap:
            name: nautilus-config
        - name: attestation-key
          secret:
            secretName: nautilus-attestation-key
        - name: state
          emptyDir:
            sizeLimit: 512Mi
        # The audit log is the record of every decision. emptyDir keeps this
        # example self-contained; point it at a PersistentVolumeClaim or ship
        # the lines to a collector before you rely on it.
        - name: audit
          emptyDir:
            sizeLimit: 2Gi
