apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautilus
  labels:
    app.kubernetes.io/name: nautilus
spec:
  # More than one replica needs shared state: the postgres session store above,
  # a shared session_tokens.key_ring_path, and one writer for a chained
  # attestation sink. See docs/how-to/operator-guide.md#running-more-than-one-replica.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nautilus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nautilus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: nautilus
          # Built from the repository Dockerfile: docker build -t nautilus:latest .
          # The published image carries no database drivers; add the extras your
          # sources need (pip install 'nautilus-rkm[postgres]').
          image: nautilus:latest
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/config/nautilus.yaml", "--bind", "0.0.0.0:8000", "--log-format", "json"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: nautilus-secrets
          # Traces are exported only when an endpoint is set. Left unset the
          # broker still creates spans and still serves every nautilus_* series
          # on /metrics; it just has nowhere to send traces, and says nothing
          # about it. Point this at a collector to turn export on.
          # env:
          #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #     value: http://otel-collector.observability:4318
          # /healthz is static: the process is up. /readyz also probes the
          # session store and the audit sink, so a broker that cannot write its
          # audit log leaves the rotation instead of serving unrecorded requests.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # One uvicorn worker, and the per-request work is dominated by
            # synchronous CPU on that one event loop -- measured throughput does
            # not rise with concurrency, so a pod cannot use more than a core
            # and is throttled by anything less. 250m sized this for roughly a
            # quarter of the rate the same image serves on a full core.
            requests:
              cpu: "1"
              memory: 512Mi
              # The audit log is append-only and grows with traffic. Without a
              # request the scheduler places this pod with no regard for the
              # disk it will use; without a limit the node hits disk pressure
              # first, and disk pressure is a node condition -- the eviction
              # manager takes down the neighbours too. Keep the two emptyDir
              # sizeLimits below at or under this limit.
              ephemeral-storage: 2Gi
            limits:
              memory: 1Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: attestation-key
              mountPath: /etc/nautilus/keys
              readOnly: true
            - name: state
              mountPath: /var/lib/nautilus
            - name: audit
              mountPath: /var/log/nautilus
      volumes:
        - name: config
          configMap:
            name: nautilus-config
        - name: attestation-key
          secret:
            secretName: nautilus-attestation-key
        - name: state
          emptyDir:
            sizeLimit: 512Mi
        # The audit log is the record of every decision. emptyDir keeps this
        # example self-contained; point it at a PersistentVolumeClaim or ship
        # the lines to a collector before you rely on it.
        - name: audit
          emptyDir:
            sizeLimit: 2Gi
