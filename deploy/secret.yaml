# Replace every value below before applying. `stringData` is written in the
# clear in this file, so it belongs in your secret manager (sealed-secrets,
# External Secrets, SOPS), not in git.
apiVersion: v1
kind: Secret
metadata:
  name: nautilus-secrets
  labels:
    app.kubernetes.io/name: nautilus
type: Opaque
stringData:
  # The X-API-Key callers must present. Generate with: openssl rand -hex 32
  NAUTILUS_API_KEY: replace-me
  # Source credentials. The broker is the only thing that holds these — an
  # agent never sees a DSN (docs/concepts/trust-boundary.md).
  ORDERS_DSN: postgresql://nautilus:replace-me@postgres:5432/orders
  SESSION_DSN: postgresql://nautilus:replace-me@postgres:5432/sessions
---
# The Ed25519 key attestations are signed with. Generate one with:
#   nautilus key generate --out attestation.pem
apiVersion: v1
kind: Secret
metadata:
  name: nautilus-attestation-key
  labels:
    app.kubernetes.io/name: nautilus
type: Opaque
stringData:
  attestation.pem: |
    -----BEGIN PRIVATE KEY-----
    replace-me
    -----END PRIVATE KEY-----
